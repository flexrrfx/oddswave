name: Update Odds Data

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update odds JSON
        run: node scripts/update-odds.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit updated odds
        run: |
          git config user.name "OddsWave Bot"
          git config user.email "actions@github.com"
          git add data/nba.json data/mlb.json
          git commit -m "Update odds data" || echo "No changes to commit"
          git pull --rebase origin main
          git push